<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold, next 30 days</title>
<style>
  :root {
    --paper: #f4f0e6;
    --ink: #1c1915;
    --muted: #6d665e;
    --line: #e2dacb;
    --card: #fffdf8;
    --gold: #8a5410;
    --gold-soft: #f3e6d2;
    --up: #0d7a46;
    --down: #b42318;
    --up-soft: #e5f4ec;
    --down-soft: #fdeceb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Noto Sans", "Nirmala UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 22px; }
  .mark { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  h1 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; font-size: 34px; line-height: 1.05; font-weight: 600; margin: 4px 0 0; }
  .when { text-align: right; color: var(--muted); font-size: 13px; }
  .when strong { color: var(--ink); font-weight: 650; }
  .hero { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: stretch; margin-bottom: 18px; }
  .price-card { background: var(--card); border: 1px solid var(--line); padding: 18px 20px 16px; }
  .price-card.ahead { background: var(--ink); color: #f7f3ea; border-color: var(--ink); }
  .kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .ahead .kicker { color: #e2c48a; }
  .hindi { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; }
  .ahead .hindi { color: #c9c0b2; }
  .rupee { font-family: Georgia, "Iowan Old Style", serif; font-size: 42px; line-height: 1.05; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 14px; }
  .ahead .sub { color: #d9d0c3; }
  .move { display: inline-block; margin-top: 8px; padding: 3px 8px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .move.up { background: var(--up-soft); color: var(--up); }
  .move.down { background: var(--down-soft); color: var(--down); }
  .move.flat { background: var(--gold-soft); color: var(--gold); }
  .ahead .move.up { background: #143d2a; color: #8ee0b2; }
  .ahead .move.down { background: #4a1c1c; color: #ffb4ae; }
  .ahead .move.flat { background: #3a3124; color: #e2c48a; }
  .bridge { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 92px; color: var(--muted); font-size: 13px; text-align: center; }
  .bridge b { color: var(--ink); font-size: 15px; }
  .band { margin-top: 10px; font-size: 14px; }
  section { background: var(--card); border: 1px solid var(--line); padding: 16px 18px 18px; margin-bottom: 14px; }
  .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
  h2 { font-size: 18px; margin: 0; font-weight: 650; }
  .caption { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  canvas { width: 100%; height: 320px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .swatch { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; }
  .miles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .mile { border-top: 2px solid var(--line); padding-top: 6px; }
  .mile.end { border-top-color: var(--gold); }
  .mile span { display: block; color: var(--muted); font-size: 12px; }
  .mile strong { font-variant-numeric: tabular-nums; font-size: 15px; }
  .ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .rung { border: 1px solid var(--line); padding: 12px 12px 10px; background: #fff; }
  .rung .role { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .rung .px { font-family: Georgia, serif; font-size: 28px; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .split { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; }
  .split section { margin: 0; }
  .driver { display: grid; grid-template-columns: 132px 1fr; gap: 8px; align-items: center; margin: 8px 0; }
  .driver .name { font-size: 14px; font-weight: 650; }
  .track { height: 8px; background: #efeae0; position: relative; }
  .bar { position: absolute; top: 0; height: 8px; }
  .bar.up { background: var(--up); }
  .bar.down { background: var(--down); }
  .driver .detail { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -4px; }
  .headline { padding: 8px 0; border-top: 1px solid var(--line); }
  .headline a { color: var(--ink); text-decoration: none; font-weight: 650; }
  .headline a:hover { color: var(--gold); }
  .tone { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .tone.firm { color: var(--up); }
  .tone.soft { color: var(--down); }
  .tone.mixed { color: var(--muted); }
  .world { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 16px; }
  .world div span { display: block; color: var(--muted); font-size: 12px; }
  .world strong { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 650; padding: 4px 8px 6px 0; }
  td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .feeds { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--up); }
  .dot.bad { background: var(--down); }
  .note { color: var(--muted); font-size: 13px; }
  .error { background: var(--down-soft); border: 1px solid #f3c4c0; padding: 16px; }
  @media (max-width: 800px) {
    h1 { font-size: 28px; }
    header, .hero, .split, .ladder, .miles, .world { display: block; }
    .when { text-align: left; margin-top: 8px; }
    .bridge { margin: 8px 0; align-items: flex-start; }
    .rupee { font-size: 36px; }
    .rung, .mile, .world div { margin-bottom: 10px; }
    canvas { height: 260px; }
  }
</style>
</head>
<body>
<main id="app">
  <p class="mark">Reading the rates…</p>
</main>
<script>
const app = document.getElementById("app");
let drawn = null;

function inr(value, digits) {
  if (value == null || Number.isNaN(Number(value))) return "—";
  return "₹" + Number(value).toLocaleString("en-IN", {
    minimumFractionDigits: digits || 0,
    maximumFractionDigits: digits || 0,
  });
}
function pct(value, digits) {
  if (value == null || Number.isNaN(Number(value))) return "—";
  const n = Number(value) * 100;
  const d = digits == null ? 1 : digits;
  const body = Math.abs(n).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  if (n > 0.0000001) return "+" + body + "%";
  if (n < -0.0000001) return "−" + body + "%";
  return body + "%";
}
function dayText(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-IN", {
    day: "numeric", month: "short", timeZone: "UTC",
  });
}
function clock(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata",
    day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true,
  }) + " IST";
}
function toneClass(value) {
  if (value > 0.0005) return "up";
  if (value < -0.0005) return "down";
  return "flat";
}
function lean(value) {
  if (value > 0.015) return "higher";
  if (value > 0.004) return "a little higher";
  if (value < -0.015) return "lower";
  if (value < -0.004) return "a little lower";
  return "about flat";
}
function esc(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function render(data) {
  if (!data || data.ok === false) {
    app.innerHTML = `<div class="error"><h1>Rates not ready</h1><p>${esc(data && (data.error || data.status) || "Still loading.")}</p><p class="note">Next try ${esc(clock(data && data.next_update))}.</p></div>`;
    drawn = null;
    return;
  }
  const now = data.now || {};
  const ahead = data.ahead || {};
  const goldm = (data.india || {}).goldm || {};
  const change = ahead.change_pct || 0;
  const cls = toneClass(change);
  const target = dayText(data.target_date);
  const front = (goldm.contracts || [])[0];
  const gap = front ? now.inr_10g_24k - front.price : null;

  app.innerHTML = `
    <header>
      <div>
        <div class="mark">India gold outlook</div>
        <h1>Today, and 30 days on</h1>
      </div>
      <div class="when">
        <div>Gold quote <strong>${esc(clock(data.price_as_of || data.as_of))}</strong></div>
        <div>Next hour <strong id="next">${esc(clock(data.next_update))}</strong></div>
      </div>
    </header>
    <p style="margin-top:-8px">${esc("The model puts 24 carat gold " + lean(change) + " on " + target + ".")} This is a scenario, not a promise. Making charges are extra.</p>
    <div class="hero">
      <article class="price-card">
        <div class="kicker">Now <span class="hindi">आज का भाव</span></div>
        <div class="rupee">${inr(now.inr_10g_24k)}</div>
        <div class="sub">24 carat · 10 grams</div>
        <div class="sub">${inr(now.inr_10g_22k)} for 22 carat · ${inr(now.inr_1g_24k)} a gram</div>
        <div class="move ${toneClass(now.day_change_pct)}">${pct(now.day_change_pct)} today</div>
      </article>
      <div class="bridge"><b>${pct(change)}</b><span>${inr(ahead.change_inr)} per 10g</span></div>
      <article class="price-card ahead">
        <div class="kicker">${esc(target)} <span class="hindi">30 दिन बाद</span></div>
        <div class="rupee">${inr(ahead.inr_10g_24k)}</div>
        <div class="sub">24 carat · 10 grams · model</div>
        <div class="sub">${inr(ahead.inr_10g_22k)} for 22 carat · ${inr(ahead.inr_1g_24k)} a gram</div>
        <div class="band">Band ${inr(ahead.low_10g)} – ${inr(ahead.high_10g)}</div>
      </article>
    </div>
    <section>
      <div class="section-head">
        <h2>Shop rate, last 30 days and the next 30</h2>
      </div>
      <p class="caption">Rupees per 10 grams, 24 carat. Solid line is the past. Shaded path is the next 30 days. Dots are MCX Gold Mini. ${esc((data.series || {}).history_note || "")}</p>
      <canvas id="chart" width="1040" height="320"></canvas>
      <div class="legend">
        <span><i class="swatch" style="background:#1c1915"></i>Last 30 days</span>
        <span><i class="swatch" style="background:#8a5410"></i>Model, next 30 days</span>
        <span><i class="swatch" style="background:#f3e6d2;height:8px"></i>Low to high band</span>
        <span><i class="swatch" style="background:#0d7a46;height:8px;width:8px;border-radius:50%"></i>MCX GOLDM</span>
      </div>
      <div class="miles" id="miles"></div>
    </section>
    <section>
      <div class="section-head"><h2>MCX Gold Mini ladder</h2></div>
      <p class="caption" id="carry"></p>
      <div class="ladder" id="ladder"></div>
    </section>
    <div class="split">
      <section>
        <h2>What is leaning on the month</h2>
        <p class="caption">Each bar is that source’s push on the 30-day rate. Longer means a bigger push.</p>
        <div id="drivers"></div>
      </section>
      <section>
        <h2>Zerodha Pulse</h2>
        <p class="caption" id="pulse-score"></p>
        <div id="pulse"></div>
      </section>
    </div>
    <section style="margin-top:14px">
      <h2>World prices behind the rupee rate</h2>
      <div class="world" id="world" style="margin-top:10px"></div>
    </section>
    <section>
      <h2>Tijori Finance</h2>
      <p class="caption">India share-market groups. Jewellery demand sits beside the gold rate. It is not inside the weight mix. <a href="https://www.tijorifinance.com/markets">tijorifinance.com</a></p>
      <table id="tijori"></table>
    </section>
    <p class="note">${esc(data.disclaimer || "")}</p>
    <p class="note">${esc((data.anchor || {}).source || "")}. Before making charges.</p>
    <div class="feeds" id="feeds"></div>
  `;

  drawMiles(data.series && data.series.forward);
  drawLadder(goldm, gap, data.target_date, ahead.mcx_10g);
  drawDrivers(data.drivers || []);
  drawPulse(data.pulse || {});
  drawWorld(data);
  drawTijori(data.tijori || {});
  drawFeeds(data.feeds || []);
  drawn = data;
  paint();
}

function drawMiles(forward) {
  const box = document.getElementById("miles");
  const steps = [0, 7, 14, 21, 30];
  box.innerHTML = steps.map((step) => {
    const row = (forward || [])[step];
    if (!row) return "";
    const end = step === 30 ? " end" : "";
    const label = step === 0 ? "Today" : step + " days · " + dayText(row.date);
    return `<div class="mile${end}"><span>${esc(label)}</span><strong>${inr(row.base)}</strong><span>${inr(row.low)} – ${inr(row.high)}</span></div>`;
  }).join("");
}

function drawLadder(goldm, gap, target, implied) {
  const box = document.getElementById("ladder");
  const note = document.getElementById("carry");
  const rows = goldm.contracts || [];
  if (!goldm.ok || !rows.length) {
    note.textContent = goldm.error || "MCX Gold Mini did not answer this hour.";
    box.innerHTML = "";
    return;
  }
  const carry = goldm.carry_pct != null
    ? `The next contract is ${pct(goldm.carry_pct)} ${goldm.carry_pct >= 0 ? "above" : "below"} this month over ${goldm.carry_days} days. That gap is mostly the cost of holding gold, not a promise the shop rate moves by the same amount.`
    : "";
  const gapBit = gap != null
    ? ` The shop rate is ${inr(Math.abs(gap))} ${gap >= 0 ? "above" : "below"} the front contract.`
    : "";
  const impliedBit = implied != null
    ? ` Around ${dayText(target)}, the ladder reads about ${inr(implied)} per 10 grams.`
    : "";
  note.textContent = (goldm.note || "Rupees per 10 grams.") + " " + carry + gapBit + impliedBit;
  box.innerHTML = rows.map((row) => {
    const oi = row.oi != null ? `Open interest ${Number(row.oi).toLocaleString("en-IN")}` : "";
    return `<article class="rung">
      <div class="role">${esc(row.role)}</div>
      <div class="px">${inr(row.price)}</div>
      <div>${esc(dayText(row.expiry))} · ${row.days_left} days</div>
      <div class="move ${toneClass(row.change_pct)}">${pct(row.change_pct)} today</div>
      <div class="sub">${esc(oi)}</div>
    </article>`;
  }).join("");
}

function drawDrivers(drivers) {
  const box = document.getElementById("drivers");
  const max = Math.max(0.002, ...drivers.map((row) => Math.abs(row.contribution_pct || 0)));
  box.innerHTML = drivers.map((row) => {
    const value = row.contribution_pct;
    if (value == null) {
      return `<div class="driver"><div class="name">${esc(row.title)}</div><div class="detail">${esc(row.detail)}. ${esc(row.plain)}</div></div>`;
    }
    const width = Math.abs(value) / max * 50;
    const side = value >= 0 ? `left:50%;width:${width}%` : `right:50%;width:${width}%`;
    return `<div class="driver">
      <div class="name">${esc(row.title)}</div>
      <div class="track"><i class="bar ${value >= 0 ? "up" : "down"}" style="${side}"></i></div>
      <div class="detail">${esc(row.detail)} · push ${pct(value, 2)}. ${esc(row.plain)}</div>
    </div>`;
  }).join("");
}

function drawPulse(pulse) {
  const score = document.getElementById("pulse-score");
  const box = document.getElementById("pulse");
  if (!pulse.ok) {
    score.textContent = pulse.error || "Pulse did not answer this hour.";
    box.innerHTML = "";
    return;
  }
  const word = pulse.score == null ? "no gold headlines scored" : (pulse.score > 0.15 ? "headlines lean firm" : pulse.score < -0.15 ? "headlines lean soft" : "headlines are mixed");
  score.textContent = `Score ${pulse.score == null ? "—" : (pulse.score > 0 ? "+" : "") + pulse.score.toFixed(2)} · ${word}. Firm means the words sound supportive for gold.`;
  const items = pulse.headlines || [];
  box.innerHTML = items.length ? items.map((item) => {
    const tone = item.tone > 0 ? "firm" : item.tone < 0 ? "soft" : "mixed";
    const label = item.tone > 0 ? "Firm" : item.tone < 0 ? "Soft" : "Mixed";
    return `<div class="headline"><div class="tone ${tone}">${label}</div><a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.title)}</a></div>`;
  }).join("") : `<p class="note">No gold, rupee, or dollar headlines in the latest Pulse batch.</p>`;
}

function drawWorld(data) {
  const world = data.world || {};
  const bees = (data.india || {}).niftybees || {};
  const rows = [
    ["World gold", world.comex, (row) => row.price != null ? "$" + Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 1 }) + " / oz" : "—"],
    ["Gold BeES", world.goldbees, (row) => row.price != null ? "₹" + Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 2 }) : "—"],
    ["Rupee", world.usdinr, (row) => row.price != null ? "₹" + Number(row.price).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—"],
    ["Dollar vs majors", world.dxy, (row) => row.price != null ? Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 1 }) : "—"],
    ["US 10-year", world.us10y, (row) => row.price != null ? Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 2 }) + "%" : "—"],
    ["WTI crude", world.crude, (row) => row.price != null ? "$" + Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 1 }) : "—"],
    ["Silver", world.silver, (row) => row.price != null ? "$" + Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 2 }) + " / oz" : "—"],
    ["Gold / silver", { ok: world.gold_silver_ratio != null, price: world.gold_silver_ratio, change_pct: null }, (row) => row.price != null ? Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 1 }) : "—"],
    ["Nifty BeES", bees, (row) => row.price != null ? "₹" + Number(row.price).toLocaleString("en-IN", { maximumFractionDigits: 2 }) : "—"],
  ];
  document.getElementById("world").innerHTML = rows.map(([label, row, fmt]) => {
    const live = row || {};
    const day = live.ok === false ? "unavailable" : pct(live.change_pct);
    return `<div><span>${esc(label)}</span><strong>${esc(fmt(live))}</strong><span class="${toneClass(live.change_pct)}">${esc(day)}${live.return_20d != null ? " · 20 sessions " + pct(live.return_20d) : ""}</span></div>`;
  }).join("");
}

function drawTijori(tijori) {
  const table = document.getElementById("tijori");
  const rows = tijori.rows || [];
  if (!tijori.ok || !rows.length) {
    table.outerHTML = `<p class="note">${esc(tijori.error || "Tijori did not answer this hour.")}</p>`;
    return;
  }
  const head = "<tr><th>Group</th><th>Today</th><th>Week</th><th>Month</th><th>3 months</th></tr>";
  table.innerHTML = head + rows.map((row) => `<tr>
    <td>${esc(row.name)}</td>
    <td>${row.day_pct == null ? "—" : pct(row.day_pct / 100)}</td>
    <td>${row.week_pct == null ? "—" : pct(row.week_pct / 100)}</td>
    <td>${row.month_pct == null ? "—" : pct(row.month_pct / 100)}</td>
    <td>${row.three_month_pct == null ? "—" : pct(row.three_month_pct / 100)}</td>
  </tr>`).join("");
}

function drawFeeds(feeds) {
  document.getElementById("feeds").innerHTML = feeds.map((row) =>
    `<span><i class="dot${row.ok ? "" : " bad"}"></i>${esc(row.label)}</span>`
  ).join("");
}

function paint() {
  const canvas = document.getElementById("chart");
  if (!canvas || !drawn) return;
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth || 1040;
  const height = 320;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const history = ((drawn.series || {}).history || []).filter((row) => row.inr_10g != null);
  const forward = ((drawn.series || {}).forward || []).filter((row) => row.base != null);
  const contracts = (((drawn.india || {}).goldm || {}).contracts || []).filter((row) => row.price != null && row.expiry);
  if (!history.length || !forward.length) return;

  const pad = { l: 92, r: 54, t: 18, b: 28 };
  const dates = []
    .concat(history.map((row) => row.date))
    .concat(forward.map((row) => row.date))
    .concat(contracts.map((row) => row.expiry))
    .sort();
  const minDate = Date.parse(dates[0] + "T00:00:00Z");
  const maxDate = Date.parse(dates[dates.length - 1] + "T00:00:00Z");
  const span = Math.max(1, maxDate - minDate);
  const ys = []
    .concat(history.map((row) => row.inr_10g))
    .concat(forward.flatMap((row) => [row.low, row.high]))
    .concat(contracts.map((row) => row.price));
  let minY = Math.min(...ys);
  let maxY = Math.max(...ys);
  const yPad = (maxY - minY) * 0.08 || 1000;
  minY -= yPad;
  maxY += yPad;
  const xOf = (iso) => pad.l + (Date.parse(iso.slice(0, 10) + "T00:00:00Z") - minDate) / span * (width - pad.l - pad.r);
  const yOf = (value) => pad.t + (maxY - value) / (maxY - minY) * (height - pad.t - pad.b);

  ctx.strokeStyle = "#e2dacb";
  ctx.fillStyle = "#6d665e";
  ctx.font = "12px Segoe UI, Noto Sans, sans-serif";
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i += 1) {
    const value = minY + (maxY - minY) * (i / 3);
    const y = yOf(value);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(width - pad.r, y);
    ctx.stroke();
    ctx.fillText(inr(value), 8, y + 4);
  }
  const ticks = [dates[0], forward[0].date, forward[forward.length - 1].date, dates[dates.length - 1]];
  const seen = {};
  ticks.forEach((iso) => {
    const key = iso.slice(0, 10);
    if (seen[key]) return;
    seen[key] = true;
    const x = xOf(key);
    ctx.fillText(dayText(key), x - 18, height - 8);
  });

  ctx.beginPath();
  forward.forEach((row, index) => {
    const x = xOf(row.date);
    const y = yOf(row.high);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  for (let index = forward.length - 1; index >= 0; index -= 1) {
    ctx.lineTo(xOf(forward[index].date), yOf(forward[index].low));
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(141, 90, 18, 0.16)";
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = 2;
  history.forEach((row, index) => {
    const x = xOf(row.date);
    const y = yOf(row.inr_10g);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle = "#8a5410";
  ctx.setLineDash([5, 4]);
  forward.forEach((row, index) => {
    const x = xOf(row.date);
    const y = yOf(row.base);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  const todayX = xOf(forward[0].date);
  ctx.strokeStyle = "#6d665e";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(todayX, pad.t);
  ctx.lineTo(todayX, height - pad.b);
  ctx.stroke();

  contracts.forEach((row) => {
    const x = xOf(row.expiry);
    const y = yOf(row.price);
    ctx.beginPath();
    ctx.fillStyle = "#0d7a46";
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1c1915";
    const label = dayText(row.expiry);
    const labelX = x > width - pad.r - 36 ? x - 40 : x + 8;
    ctx.fillText(label, labelX, y - 8);
  });
}

async function tick() {
  try {
    const response = await fetch("/api/outlook", { cache: "no-store" });
    const data = await response.json();
    const next = document.getElementById("next");
    if (drawn && data.ok && drawn.as_of === data.as_of && next) {
      next.textContent = clock(data.next_update);
      return;
    }
    render(data);
  } catch (err) {
    if (!drawn) {
      app.innerHTML = `<div class="error"><h1>Rates not ready</h1><p>${esc(err.message)}</p></div>`;
    }
  }
}

window.addEventListener("resize", paint);
tick();
setInterval(tick, 60000);
</script>
</body>
</html>
